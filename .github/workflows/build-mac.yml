name: Build macOS Desktop App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the dmg to'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd desktop-electron
          npm install

      - name: Build macOS DMG
        run: |
          cd desktop-electron
          npm run dist:mac

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeonixAI-macOS-DMG
          path: desktop-electron/dist/*.dmg

      - name: Attach DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.release_tag != '' }}
        with:
          tag_name: ${{ inputs.release_tag }}
          files: desktop-electron/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
